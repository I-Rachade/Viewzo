name: Deploy

# Builds the API and web images. On pull requests they are only built, on
# every push to main they are also pushed to GHCR.
# The deploy job only runs once the repository variable DEPLOY_HOST is set,
# and it uses the "production" environment, so a required reviewer can be
# added there to approve every deploy by hand.

on:
  push:
    branches: [main]
  pull_request:
    paths: [backend/**, frontend/web/**, deploy/**, .github/workflows/deploy.yml]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: viewzo-api
            context: backend
          - name: viewzo-web
            context: frontend/web
          - name: viewzo-backup
            context: deploy/backup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.DOMAIN || 'example.com' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi
      - name: Copy stack files
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile \
            "deploy@${{ vars.DEPLOY_HOST }}:/opt/viewzo/"
      - name: Pull and restart
        # The pulled images are also tagged latest on the server, so a manual
        # `docker compose up -d` without IMAGE_TAG starts this version too.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh "deploy@${{ vars.DEPLOY_HOST }}" \
            "cd /opt/viewzo \
            && docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && export IMAGE_TAG='${{ github.sha }}' \
            && docker compose pull \
            && for img in \$(docker compose config --images | grep \":\$IMAGE_TAG\$\"); do \
                 docker tag \"\$img\" \"\${img%:*}:latest\" || true; \
               done \
            && docker compose up -d --remove-orphans \
            && docker image prune -f \
            && docker logout ghcr.io"
