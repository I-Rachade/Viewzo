services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viewzo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Not used yet; reserved for BullMQ jobs (view checks, timers, notifications).
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
