# Production stack for the VPS. Images are built by GitHub Actions and pulled
# from GHCR; secrets live in .env next to this file (see .env.example).
name: viewzo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viewzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: viewzo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewzo -d viewzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:-i-rachade}/viewzo-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://viewzo:${POSTGRES_PASSWORD}@postgres:5432/viewzo
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET in .env}
      OTP_PROVIDER: ${OTP_PROVIDER:-didit}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-didit}
      DIDIT_KYC_WORKFLOW_ID: ${DIDIT_KYC_WORKFLOW_ID:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_TOKEN: ${CLOUDFLARE_EMAIL_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@viewzo.app}
      FOUNDER_BADGE_LIMIT: ${FOUNDER_BADGE_LIMIT:-1000}
      DEFAULT_REGION: ${DEFAULT_REGION:-TG}
      WHATSAPP_VERIFICATION_NUMBERS: ${WHATSAPP_VERIFICATION_NUMBERS:-}
      PORT: 3001
      WEB_ORIGIN: https://${DOMAIN}
      API_PUBLIC_URL: https://api.${DOMAIN}
      PAYMENT_ROUTES: ${PAYMENT_ROUTES:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-}
      ALLOW_TEST_PAYMENTS: ${ALLOW_TEST_PAYMENTS:-}
      PAYOUT_SECOND_APPROVAL_FROM: ${PAYOUT_SECOND_APPROVAL_FROM:-100000}
      MIN_WITHDRAWAL: ${MIN_WITHDRAWAL:-1000}
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      FEDAPAY_ENV: ${FEDAPAY_ENV:-live}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_TRANSFER_PASSWORD: ${CINETPAY_TRANSFER_PASSWORD:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      UPLOAD_DIR: /data/uploads
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      TOKEN_ENCRYPTION_KEY_PREVIOUS: ${TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
    volumes:
      # Screenshots creators send as proof.
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: ghcr.io/${GHCR_OWNER:-i-rachade}/viewzo-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  # Daily pg_dump to Cloudflare R2 (see backup/backup.sh).
  backup:
    image: ghcr.io/${GHCR_OWNER:-i-rachade}/viewzo-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: viewzo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: viewzo
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in .env}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: auto

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
